spring:
  application:
    name: ecommerce

  datasource:
    url: jdbc:mysql://localhost:3306/ecommerce_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  mail:
    host: localhost
    port: 1025
    username: noreply@ecommerce.local
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

app:
  admin:
    email: ${ADMIN_EMAIL:admin@eshop.com}
    password: ${ADMIN_PASSWORD:admin@123}
    full-name: ${ADMIN_FULL_NAME:System Administrator}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:dev-ecommerce-jwt-signing-secret-key}
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
  mail:
    enabled: false
  storage:
    provider: ${STORAGE_PROVIDER:minio}
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadminpassword}
      bucket: ${MINIO_BUCKET:ecommerce-product-images}
      public-url: ${MINIO_PUBLIC_URL:http://localhost:9000}
    local:
      base-path: ${LOCAL_STORAGE_PATH:./uploads}
      public-url: ${LOCAL_STORAGE_PUBLIC_URL:/uploads}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    com.dev.ecommerce: DEBUG
